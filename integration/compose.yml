services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
      GPU: "N"
      USER_PORTS: "3389,9876"
      SKETCHUP_INSTALLER: ${SKETCHUP_INSTALLER:-./installers/SketchUp2025.exe}
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    ports:
      - 8006:8006
      - 3390:3389/tcp # host 3389 is taken by gnome-remote-desktop
      - 3390:3389/udp
      - 6123:6123 # VS Code debug port
      - 9876:9876 # TCP port for sketchup-link live sync
      - 2222:22 # guest OpenSSH (host 22 is the host's own sshd)
      - 9877:9877 # TCP port for the sketchup-mcp server (patched to 9877, see integration/mcp)
    volumes:
      - ./vm-storage:/storage
      - ./shared:/shared
      - ./oem:/oem
    restart: always
    stop_grace_period: 2m
  blender:
    build:
      context: ..
      dockerfile: integration/Dockerfile.blender
    container_name: blender
    volumes:
      - ../tests/bdd/screenshots:/screenshots
    depends_on:
      - windows
    restart: "no"
    cap_add:
      - SYS_ADMIN
  blender-5.2:
    build:
      context: ..
      dockerfile: integration/Dockerfile.blender-5.2
    container_name: blender-5.2
    volumes:
      - ../tests/bdd/screenshots:/screenshots
    depends_on:
      - windows
    restart: "no"
    cap_add:
      - SYS_ADMIN
